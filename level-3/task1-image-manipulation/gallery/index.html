<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Click any thumbnail to enlarge</h2>

  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=400" onclick="enlarge(this)">
    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400" onclick="enlarge(this)">
    <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=400" onclick="enlarge(this)">
    <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=400" onclick="enlarge(this)">
  </div>

  <!-- overlay for the enlarged view -->
  <div id="overlay" onclick="closeOverlay()">
    <img id="overlayImg">
  </div>

  <script src="script.js"></script>
</body>
</html>
