<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Card - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="card mx-auto" style="max-width: 350px;">
      <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=500" class="card-img-top" alt="workspace">
      <div class="card-body">
        <h5 class="card-title">DGU Sports</h5>
        <p class="card-text">
          Android app I built for managing sports events on campus -
          Firebase auth, real-time updates, PDF receipts, the works.
        </p>
        <a href="#" class="btn btn-primary">View project</a>
      </div>
    </div>
  </div>

</body>
</html>
