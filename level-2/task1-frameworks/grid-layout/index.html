<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .box { background:#4b6cb7; color:white; padding:30px; text-align:center; border-radius:6px; }
  </style>
</head>
<body>

  <div class="container py-5">
    <h4 class="mb-4">Project grid</h4>
    <div class="row g-3">
      <div class="col-md-4 col-sm-6"><div class="box">DGU Sports</div></div>
      <div class="col-md-4 col-sm-6"><div class="box">KirSetu</div></div>
      <div class="col-md-4 col-sm-6"><div class="box">BloodLink AI</div></div>
    </div>
    <!-- resize the browser window, columns should stack on mobile -->
  </div>

</body>
</html>
